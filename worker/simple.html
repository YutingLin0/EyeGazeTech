<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye Gaze Lab · Communication Board</title>
<style>
:root{font:100%/1.45 system-ui,sans-serif;background:#eef3f5;color:#172e3c;--accent:#07665b;--line:#b7c9cf}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}.wrap{width:min(100% - 1.5rem,57rem);margin:auto;padding:.85rem 0 1.25rem}
header{display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:.65rem}
h1{font-size:clamp(1.55rem,4vw,2.35rem);margin:0;letter-spacing:-.055em}a{color:#18545b}
button{font:inherit;color:inherit;cursor:pointer;font-weight:700;background:white;border:1px solid var(--line);border-radius:.7rem;padding:.43rem .75rem}
button:focus-visible,a:focus-visible{outline:3px solid #ab4500;outline-offset:3px}button:disabled{cursor:default;opacity:.6}.primary{background:var(--accent);border-color:var(--accent);color:white}
.toolbar{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.4rem}.status{height:2.9em;color:#365362;margin:.25rem 0 .5rem}.message{height:3rem;padding:.45rem .75rem;background:white;border:1px solid var(--line);border-radius:.7rem;font-size:1.2rem;font-weight:700;overflow:auto;margin:0 0 .65rem}.message:empty::before{content:'Your message appears here';font-weight:400;color:#48616c}
#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.45rem,1.5vw,.85rem);position:relative}
.tile{min-width:0;min-height:clamp(3.5rem,13dvh,6.2rem);font-size:clamp(1rem,3vw,1.6rem);position:relative;overflow:hidden;background:#fff}
.tile.action{min-height:clamp(2.85rem,9dvh,4.6rem);font-size:clamp(.92rem,2.8vw,1.25rem);background:#dfeaed}.tile.primary{background:var(--accent)}.tile.ready{outline:3px solid #0f8e7b;outline-offset:1px;background:#d9f2eb;color:#103e38}
.tile::after{content:'';position:absolute;left:0;bottom:0;width:var(--fill,0%);height:7px;background:#1db095}.tile.check{border:3px solid #a7480c;background:#ffe8d0;color:#543015}
#dot{position:fixed;pointer-events:none;z-index:5;display:grid;place-items:center;width:2.65rem;height:2.65rem;transform:translate(-50%,-50%);background:conic-gradient(#20a68f var(--fill,0%),#fff 0);border:3px solid #075d54;border-radius:50%;font-weight:800}
#board.calibrating .tile{color:transparent;background:#e5ecee}.tile.check:disabled{opacity:1}.tip{margin:.65rem 0 0;color:#365362;font-size:.9rem}
@media(max-height:560px){.wrap{padding-top:.3rem}.tile{min-height:2.55rem}.tile.action{min-height:2.25rem}.status{height:2.9em}.message{height:2.25rem;padding:.2rem .6rem}.tip{margin-top:.3rem}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>Eye Gaze Lab</h1><a href="/match">Classroom match</a></header>
<div class="toolbar">
<button class="primary" id="enable">Start eye gaze</button>
<button id="retry" hidden>Recalibrate</button>
<button id="stop" hidden>Turn camera off</button>
</div>
<p class="status" id="status" role="status">Try “I want water.” Click a tile, or start eye gaze to select it with your eyes.</p>
<div class="message" id="message" aria-label="Your message" aria-live="polite"></div>
<div id="board" aria-label="Communication board">
<button class="tile">I</button><button class="tile">want</button><button class="tile">water</button>
<button class="tile">need</button><button class="tile">help</button><button class="tile">please</button>
<button class="tile action" data-action="undo">Undo</button>
<button class="tile action primary" data-action="speak">Speak</button>
<button class="tile action" data-action="clear">Clear</button>
</div>
<p class="tip">Sit facing your screen in even light. During setup, keep your head still and follow the dot with your eyes.</p>
<div id="dot" hidden aria-hidden="true"></div>
</main>
<script>
const get = id => document.getElementById(id);
const board = get('board');
const tiles = Array.from(board.querySelectorAll('button'));
const status = get('status');
const dot = get('dot');
const words = [];
const order = [4,0,2,6,8,1,3,5,7];
const checks = [2,3,7];
const stay = 1050;
let mode = 'off', tracker, library, restore, generation = 0, starting = false;
let step = 0, shownAt = 0, sampleAt = 0, samples = 0, focus, entered = 0, fired = false;
let filtered, lastFrame = 0, lastEyes = 0, checkDeadline = 0, lastSeen = 0, geometry = [];
let outsideSince = 0;

function setStatus(text) {
  if (status.textContent !== text) status.textContent = text;
}
function say(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'en-US';
  speechSynthesis.speak(speech);
}
function select(tile) {
  if (mode === 'starting' || mode === 'calibrate' || mode === 'check') return;
  switch (tile.dataset.action) {
    case 'undo': words.pop(); break;
    case 'clear': words.length = 0; break;
    case 'speak':
      if (words.length) say(words.join(' '));
      return;
    default: if (words.length < 24) words.push(tile.textContent.trim());
  }
  get('message').textContent = words.join(' ');
}
for (const tile of tiles) tile.onclick = () => select(tile);

function center(rect) {
  return {x:rect.left+rect.width/2,y:rect.top+rect.height/2};
}
function resetDwell() {
  if (focus) {
    focus.classList.remove('ready');
    focus.style.removeProperty('--fill');
  }
  focus = null;
  outsideSince = 0;
  fired = false;
}
function setMode(next) {
  mode = next;
  resetDwell();
  filtered = null;
  lastFrame = 0;
  board.classList.toggle('calibrating', next === 'calibrate');
  dot.hidden = next !== 'calibrate';
  get('enable').hidden = next !== 'off';
  get('retry').hidden = !['failed','check','play'].includes(next);
  get('stop').hidden = next === 'off';
  for (const tile of tiles) {
    tile.classList.remove('check');
    tile.disabled = ['starting','calibrate','check'].includes(next);
  }
}
function closeTracker() {
  restore?.();
  restore = null;
  const video = document.querySelector('#webgazerVideoFeed');
  video?.srcObject?.getTracks().forEach(track => track.stop());
  try { tracker?.removeMouseEventListeners(); tracker?.end(); } catch {}
}
function stop(message) {
  generation++;
  closeTracker();
  setMode('off');
  setStatus(message ?? 'Camera off. You can select tiles by clicking or tapping.');
}
function loadTracker() {
  if (!library) {
    library = new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = 'https://webgazer.cs.brown.edu/webgazer.js';
      script.onload = () => window.webgazer ? resolve(window.webgazer) : reject(new Error('Tracker unavailable'));
      script.onerror = () => reject(new Error('Tracker unavailable'));
      document.head.append(script);
    }).catch(error => {library = null; throw error;});
  }
  return library;
}
function markDot() {
  const p = center(geometry[order[step]]);
  dot.style.left = p.x + 'px';
  dot.style.top = p.y + 'px';
  dot.style.setProperty('--fill','0%');
  dot.textContent = step + 1;
  shownAt = performance.now();
  sampleAt = 0;
  samples = 0;
  setStatus('Look at dot ' + (step+1) + ' of ' + order.length + ' until the ring fills.');
}
function promptCheck(now) {
  tiles.forEach(tile => tile.classList.remove('check'));
  tiles[checks[step]].classList.add('check');
  checkDeadline = now + 11500;
  resetDwell();
  setStatus('Tracking check ' + (step+1) + ' of ' + checks.length + '. Look at the orange tile until it fills.');
}
function collect(now) {
  if (now - shownAt < 600 || now - sampleAt < 165) return;
  const p = center(geometry[order[step]]);
  tracker.recordScreenPosition(p.x,p.y,'click');
  sampleAt = now;
  dot.style.setProperty('--fill', (++samples / 8 * 100) + '%');
  if (samples < 8) return;
  step++;
  if (step < order.length) {
    markDot();
    return;
  }
  restore?.();
  restore = null;
  setMode('check');
  step = 0;
  promptCheck(now);
}
function closestTile(point) {
  let best = null, bestDistance = Infinity;
  // Small gaps extend the hit area without snapping from another part of the screen.
  for (const [index, rect] of geometry.entries()) {
    const margin = 10;
    if (point.x < rect.left-margin || point.x > rect.right+margin ||
        point.y < rect.top-margin || point.y > rect.bottom+margin) continue;
    const p = center(rect);
    const distance = Math.hypot((point.x-p.x)/rect.width, (point.y-p.y)/rect.height);
    if (distance < bestDistance) {
      best = tiles[index];
      bestDistance = distance;
    }
  }
  return best;
}
function receive(prediction) {
  if (document.hidden) return;
  const now = performance.now();
  lastFrame = now;
  if (mode === 'calibrate') {
    if (!prediction?.eyeFeatures?.left || !prediction.eyeFeatures.right) {
      if (now-lastEyes > 1500) setStatus('Eyes out of view. Face the camera and look at the dot.');
      return;
    }
    if (now-lastEyes > 1500) setStatus('Look at dot ' + (step+1) + ' of ' + order.length + ' until the ring fills.');
    lastEyes = now;
    collect(now);
    return;
  }
  if (mode !== 'check' && mode !== 'play') return;
  if (!Number.isFinite(prediction?.x) || !Number.isFinite(prediction?.y)) {
    if (now-lastSeen > 380) {resetDwell(); filtered = null;}
    return;
  }
  if (lastSeen && now-lastSeen > 460) {resetDwell(); filtered = null;}
  lastSeen = now;
  const old = filtered ?? prediction;
  filtered = {x:old.x*.55+prediction.x*.45, y:old.y*.55+prediction.y*.45};
  const target = closestTile(filtered);
  if (target !== focus && focus) {
    outsideSince ||= now;
    if (now-outsideSince < 125) return;
  }
  if (target !== focus) {
    resetDwell();
    if (target && (mode === 'play' || target === tiles[checks[step]])) {
      focus = target;
      entered = now;
      focus.classList.add('ready');
    }
  } else outsideSince = 0;
  if (!focus || fired) return;
  const progress = Math.min(1,(now-entered)/stay);
  focus.style.setProperty('--fill',progress*100+'%');
  if (progress < 1) return;
  fired = true;
  if (mode === 'play') {select(focus); return;}
  step++;
  if (step < checks.length) {promptCheck(now); return;}
  setMode('play');
  setStatus('Tracking check passed. Look at a tile until its bar fills. Look away before selecting it again.');
}
function updateGeometry() {
  geometry = tiles.map(tile => tile.getBoundingClientRect());
}
async function start() {
  if (starting) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    stop('Camera access is unavailable in this browser. You can still click the tiles.');
    return;
  }
  say('Follow the dot with your eyes.');
  closeTracker();
  setMode('starting');
  setStatus('Allow camera access to begin.');
  const current = ++generation;
  starting = true;
  let timeout;
  try {
    const setup = async () => {
      tracker = await loadTracker();
      if (current !== generation) return;
      tracker.saveDataAcrossSessions(false);
      await tracker.clearData();
      if (current !== generation) return;
      tracker.showVideo(false).showFaceOverlay(false).showFaceFeedbackBox(false).showPredictionPoints(false);
      const reg = tracker.getRegression()[0];
      const predict = reg.predict;
      // Forward eye detections before there are enough samples for a prediction.
      reg.predict = eyes => eyes?.left && eyes.right ? {x:0,y:0} : null;
      restore = () => {reg.predict = predict;};
      tracker.setGazeListener(receive);
      await tracker.begin();
      if (current !== generation) {closeTracker(); return;}
      tracker.removeMouseEventListeners();
      step = 0;
      lastEyes = performance.now();
      setMode('calibrate');
      updateGeometry();
      markDot();
    };
    const limit = new Promise((_,reject) => {timeout = setTimeout(reject,25000);});
    await Promise.race([setup(),limit]);
  } catch {
    if (current === generation) stop('Camera setup did not finish. Check camera permission and try again.');
  } finally {
    starting = false;
    clearTimeout(timeout);
  }
}
get('enable').onclick = start;
get('retry').onclick = start;
get('stop').onclick = () => stop();
function handleLayout() {
  if (mode === 'calibrate' || mode === 'check' || mode === 'play') {
    updateGeometry();
    if (mode === 'calibrate') markDot();
    resetDwell();
    filtered = null;
  }
}
window.addEventListener('resize',handleLayout);
document.addEventListener('scroll',handleLayout,{passive:true});
document.addEventListener('visibilitychange',() => {resetDwell(); filtered = null;});
window.addEventListener('pagehide',() => {if (mode !== 'off') stop();});
setInterval(() => {
  if (document.hidden) return;
  const now = performance.now();
  if (mode === 'check' && now > checkDeadline) {
    closeTracker();
    setMode('failed');
    setStatus('Tracking check missed a tile. Sit square to the screen, then select Recalibrate. You can still click the tiles.');
  }
  if (lastFrame && now-lastFrame > 500) {resetDwell(); filtered = null;}
},200);
</script>
</body>
</html>
