<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye Gaze Lab · Picture Missions</title>
<style>
:root{font:100%/1.45 system-ui,sans-serif;background:#eef3f5;color:#172e3c;--accent:#07665b;--line:#b7c9cf}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}.wrap{width:min(100% - 1.5rem,57rem);margin:auto;padding:.85rem 0 1.25rem}
header{display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:.65rem}
h1{font-size:clamp(1.55rem,4vw,2.35rem);margin:0;letter-spacing:-.055em}a{color:#18545b}
button{font:inherit;color:inherit;cursor:pointer;font-weight:700;background:white;border:1px solid var(--line);border-radius:.7rem;padding:.43rem .75rem}
button:focus-visible,a:focus-visible{outline:3px solid #ab4500;outline-offset:3px}button:disabled{cursor:default;opacity:.6}.primary{background:var(--accent);border-color:var(--accent);color:white}
.camera{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}.toolbar{min-height:5.2rem;align-content:start;display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.4rem}.status{height:2.9em;color:#365362;margin:.25rem 0 .5rem}.message{height:3rem;padding:.45rem .75rem;background:white;border:1px solid var(--line);border-radius:.7rem;font-size:1.2rem;font-weight:700;overflow:auto;margin:0 0 .65rem}.message:empty::before{content:'Your message appears here';font-weight:400;color:#48616c}
#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.45rem,1.5vw,.85rem);position:relative}
.tile{min-width:0;min-height:clamp(3.5rem,13dvh,6.2rem);font-size:clamp(1rem,3vw,1.6rem);position:relative;overflow:hidden;background:#fff}
.tile.action{min-height:clamp(2.85rem,9dvh,4.6rem);font-size:clamp(.92rem,2.8vw,1.25rem);background:#dfeaed}.tile.primary{background:var(--accent)}.tile.ready{outline:3px solid #0f8e7b;outline-offset:1px;background:#d9f2eb;color:#103e38}
.tile::after{content:'';position:absolute;left:0;bottom:0;width:var(--fill,0%);height:7px;background:#1db095}.tile.check{border:3px solid #a7480c;background:#ffe8d0;color:#543015}
#dot{position:fixed;pointer-events:none;z-index:5;display:grid;place-items:center;width:2.65rem;height:2.65rem;transform:translate(-50%,-50%);background:conic-gradient(#20a68f var(--fill,0%),#fff 0);border:3px solid #075d54;border-radius:50%;font-weight:800}
#board.calibrating .tile{color:transparent;background:#e5ecee}.tile.check:disabled{opacity:1}.tip{margin:.65rem 0 0;color:#365362;font-size:.9rem}
@media(min-width:460px){.toolbar{min-height:2.15rem}}
@media(max-height:560px){.wrap{padding-top:.3rem}.tile{min-height:2.55rem}.tile.action{min-height:2.25rem}.status{height:2.9em}.message{height:2.25rem;padding:.2rem .6rem}.tip{margin-top:.3rem}}

body{background:#eef4f1}.wrap{width:min(100% - 1.5rem,54rem)}
.mission{background:#123b35;color:#fff;border-radius:1rem;display:grid;grid-template-columns:3.25rem 1fr;column-gap:.9rem;align-items:center;height:6rem;padding:.55rem 1rem;margin:0 0 .55rem}
.mission-visual{display:grid;place-items:center;border-radius:.75rem;background:#28584d;width:3.15rem;height:3.15rem;font-size:1.75rem}
.mission h2{font-size:clamp(1rem,3.7vw,1.3rem);margin:0;font-weight:800}
.mission p{margin:0;font-size:clamp(.8rem,3.1vw,.98rem);color:#d7e9e1}
.mission .mission-count{font-size:.8rem;font-weight:750;color:#abe1c3;letter-spacing:.03em}
.tile.word{display:grid;place-content:center;justify-items:center;gap:.08rem;min-height:clamp(3.65rem,12dvh,6.35rem)}
.tile-picture{font-size:clamp(1.3rem,4vh,2.05rem);line-height:1.15}.tile-label{line-height:1.2}
.tile.action{height:clamp(2.85rem,9dvh,4.6rem);padding-inline:.35rem}
.tile.word:nth-child(3n+1){background:#fdf9e9}.tile.word:nth-child(3n+2){background:#e8f4fd}.tile.word:nth-child(3n){background:#f7eefb}
.tile.word.ready{background:#d9f2eb}.tile.word.check{background:#ffe8d0}
#board.calibrating .tile .tile-picture,#board.calibrating .tile .tile-label{visibility:hidden}
.game-feedback{min-height:1.5rem;margin:.45rem 0 0;color:#215b48;font-size:.92rem;font-weight:750}
@media(max-width:390px){.mission{height:6.45rem}}
@media(max-height:650px){.mission{height:5.15rem;margin-bottom:.4rem}.mission-visual{width:2.65rem;height:2.65rem;font-size:1.4rem}.tile.word{min-height:3.3rem}.tile-picture{font-size:1.2rem}.status{margin:.15rem 0;height:2.9em}}

#gaze-cursor{position:fixed;pointer-events:none;z-index:8;width:1.6rem;height:1.6rem;border-radius:50%;transform:translate(-50%,-50%);background:conic-gradient(#079684 var(--fill,0%),#fff 0);border:2px solid #064b43;box-shadow:0 0 0 2px #ffffffb3;display:grid;place-items:center}
#gaze-cursor::before{content:'';width:.52rem;height:.52rem;background:#064b43;border-radius:50%}
@media(max-width:510px){.toolbar{min-height:5.2rem}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>Eye Gaze Lab</h1><a href="/match">Classroom match</a></header>
<div class="toolbar">
<button class="primary" id="enable">Start eye gaze</button>
<button id="retry" hidden>Recalibrate</button>
<button id="recenter" hidden>Recenter gaze</button>
<button id="speed" hidden>Dwell 0.8s</button>
<button id="stop" hidden>Turn camera off</button>
</div>
<p class="status" id="status" role="status">Start eye gaze, or click the pictures to play.</p>
<section class="mission" aria-label="Current mission">
<div id="scene-icon" class="mission-visual" aria-hidden="true">🏀</div>
<div><p id="mission-count" class="mission-count">Mission 1 of 3</p><h2 id="scene-title">After recess</h2><p id="scene-clue">You’re thirsty after playing. Ask your partner for water.</p></div>
</section>
<div class="message" id="message" aria-label="Your message" aria-live="polite"></div>
<div id="board" aria-label="Communication board">
<button class="tile word" data-word="I"><span class="tile-picture" aria-hidden="true">🙋</span><span class="tile-label">I</span></button>
<button class="tile word" data-word="want"><span class="tile-picture" aria-hidden="true">🤲</span><span class="tile-label">want</span></button>
<button class="tile word" data-word="water"><span class="tile-picture" aria-hidden="true">💧</span><span class="tile-label">water</span></button>
<button class="tile word" data-word="need"><span class="tile-picture" aria-hidden="true">❗</span><span class="tile-label">need</span></button>
<button class="tile word" data-word="help"><span class="tile-picture" aria-hidden="true">🤝</span><span class="tile-label">help</span></button>
<button class="tile word" data-word="please"><span class="tile-picture" aria-hidden="true">🙏</span><span class="tile-label">please</span></button>
<button class="tile action" data-action="undo">Undo</button>
<button class="tile action primary" data-action="speak">Speak</button>
<button class="tile action" data-action="clear">Clear</button>
</div>
<p class="game-feedback" id="game-feedback" role="status"></p>
<p class="tip">Play in pairs. One person sends the message and the other listens without reading it. Switch roles after all three missions.</p>
<video id="camera" muted playsinline aria-hidden="true" class="camera"></video>
<div id="dot" hidden aria-hidden="true"></div>
<div id="gaze-cursor" hidden aria-hidden="true"></div>
</main>
<script>
// BOARD TRACKING
const get = id => document.getElementById(id);
const board = get('board');
const tiles = Array.from(board.querySelectorAll('button'));
const status = get('status');
const dot = get('dot');
const cursor = get('gaze-cursor');
const video = get('camera');
const words = [];
const calibrationTargets=[[.10,.15],[.90,.15],[.50,.50],[.10,.85],[.90,.85]];
const checks = [2,6,4];
const missions = [
  {icon:'🏀', title:'After recess', clue:'You’re thirsty after playing. Ask your partner for water.',
    answers:['I want water','I need water','I want water please','water please']},
  {icon:'🎒', title:'Stuck zipper', clue:'Your backpack won’t open. Ask your partner for help.',
    answers:['I need help','I want help','I need help please','help please']},
  {icon:'🧩', title:'One more minute', clue:'You’re still working on a puzzle. Ask for more time.',
    answers:['I need more time','I want more time','more time']}
];
const wordPictures={water:'💧',more:'➕',please:'🙏',time:'⏱️'};
let missionIndex=0, delivered=false;
const dwellTimes=[500,800,1200];
let speedIndex=1, mode='off', camera, detector, generation=0, animation, deadline, sending;
let lastVideo=-1, lastFace=0, lastRender=0, lastFire=0, latestSignal;
let step, samples, sampleTarget, pointStartedAt, anchors, map, baseline, correction, filtered;
let focused=null, heldMs=0, locked=null, anchor=null, checkMs=0;

function setStatus(text) {
  if (status.textContent !== text) status.textContent = text;
}
function say(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'en-US';
  speechSynthesis.speak(speech);
}
function updateMission() {
  const mission=missions[missionIndex];
  const extraTime=missionIndex===2;
  const updates=[[tiles[2],extraTime?'more':'water'],[tiles[5],extraTime?'time':'please']];
  for (const [tile,word] of updates) {
    tile.dataset.word=word;
    tile.querySelector('.tile-label').textContent=word;
    tile.querySelector('.tile-picture').textContent=wordPictures[word];
  }
  get('scene-icon').textContent=mission.icon;
  get('scene-title').textContent=mission.title;
  get('scene-clue').textContent=mission.clue;
  get('mission-count').textContent='Mission '+(missionIndex+1)+' of '+missions.length;
  tiles[7].textContent='Speak';
  get('game-feedback').textContent='';
  words.length=0;
  get('message').textContent='';
}
function submitMessage() {
  if (delivered) {
    missionIndex=(missionIndex+1)%missions.length;
    delivered=false;
    updateMission();
    return;
  }
  const message=words.join(' ');
  if (!message) {
    get('game-feedback').textContent='Select pictures to build a request first.';
    return;
  }
  say(message);
  delivered=missions[missionIndex].answers.includes(message);
  if (!delivered) {
    get('game-feedback').textContent='Try a different request. Use Undo or Clear to edit it.';
    return;
  }
  const finished=missionIndex+1===missions.length;
  tiles[7].textContent=finished?'Play again':'Next mission';
  get('game-feedback').textContent=finished?'All three messages delivered! Switch roles and play again.' :
    'Message delivered! Select Next mission when ready.';
}
function select(tile) {
  if (!['off','failed','play'].includes(mode)) return;
  if (tile.dataset.action==='speak') {submitMessage(); return;}
  if (delivered) return;
  switch (tile.dataset.action) {
    case 'undo': words.pop(); break;
    case 'clear': words.length = 0; break;
    default: if (words.length < 8) words.push(tile.dataset.word || tile.textContent.trim());
  }
  get('game-feedback').textContent='';
  get('message').textContent=words.join(' ');
}
for (const tile of tiles) tile.onclick = () => select(tile);

function resetDwell() {
  focused?.classList.remove('ready');
  focused?.style.removeProperty('--fill');
  focused = null;
  anchor = null;
  heldMs = 0;
  cursor.style.setProperty('--fill','0%');
}
function setMode(next,text) {
  mode=next;
  resetDwell();
  filtered=locked=null;
  cursor.hidden=true;
  const sampling=next==='calibrate' || next==='center';
  board.classList.toggle('calibrating',sampling);
  dot.hidden=!sampling;
  get('enable').hidden=next!=='off';
  get('retry').hidden=!['failed','check','play'].includes(next);
  get('recenter').hidden=next!=='play';
  get('speed').hidden=!['check','play'].includes(next);
  get('stop').hidden=['off','failed'].includes(next);
  for (const tile of tiles) {
    tile.classList.remove('check');
    tile.disabled=['starting','calibrate','center','check'].includes(next);
  }
  if (text) setStatus(text);
}
function closeModel(model) {
  // The browser may still be finishing the final Face Mesh frame.
  const pending=model===detector ? sending : null;
  Promise.resolve(pending).catch(()=>{}).then(()=>model.close()).catch(()=>{});
}
function releaseCamera() {
  clearTimeout(deadline);
  cancelAnimationFrame(animation);
  camera?.getTracks().forEach(track=>track.stop());
  camera=null;
  video.srcObject=null;
  if (detector) closeModel(detector);
  detector=sending=null;
}
function stop(next,text) {
  generation++;
  releaseCamera();
  setMode(next,text);
}
function screenTarget() {
  const [x,y]=mode==='center' ? calibrationTargets[2] : calibrationTargets[step];
  return {x:x*window.innerWidth,y:y*window.innerHeight};
}
function markDot() {
  sampleTarget=screenTarget();
  dot.style.left=sampleTarget.x+'px';
  dot.style.top=sampleTarget.y+'px';
  dot.style.setProperty('--fill','0%');
  dot.textContent=mode==='center' ? '•' : step+1;
  pointStartedAt=0;
  samples=[];
  setStatus(mode==='center' ? 'Look at the center dot to recenter your gaze.' :
    'Look at dot '+(step+1)+' of '+calibrationTargets.length+' until the ring fills.');
}
function beginCalibration() {
  setMode('calibrate');
  step=0;
  anchors=[];
  correction={x:0,y:0};
  markDot();
}
function promptCheck() {
  tiles.forEach(tile=>tile.classList.remove('check'));
  tiles[checks[step]].classList.add('check');
  checkMs=0;
  resetDwell();
  setStatus('Tracking check '+(step+1)+' of '+checks.length+'. Look at the orange tile.');
}
function beginCheck() {
  setMode('check');
  step=0;
  promptCheck();
}
function sample(signal,now) {
  if (!pointStartedAt) pointStartedAt=now;
  const elapsed=now-pointStartedAt;
  if (elapsed>=600) samples.push(signal);
  dot.style.setProperty('--fill',Math.min(elapsed/1500,samples.length/5+.4,1)*100+'%');
  if (elapsed<1500 || samples.length<5) return;
  const gaze=sampleMedian(samples);
  if (mode==='center') {
    correction={x:gaze.x-baseline.x,y:gaze.y-baseline.y};
    beginCheck();
    return;
  }
  anchors.push({gaze,screen:sampleTarget});
  step++;
  if (step<calibrationTargets.length) {markDot(); return;}
  map=fitAffine(anchors);
  if (!map) {
    stop('failed','Calibration could not distinguish the dots. Face the camera and select Recalibrate.');
    return;
  }
  baseline=anchors[2].gaze;
  beginCheck();
}
function acceptFrame(signal,now) {
  latestSignal=signal;
  if (!signal) {
    if (now-lastFace>450 && samples?.length && ['calibrate','center'].includes(mode)) markDot();
    return;
  }
  if (now-lastFace>700) {
    if (mode==='calibrate' || mode==='center') markDot();
    if (mode==='check') promptCheck();
    if (mode==='play') setStatus('Hold your gaze on a tile until its ring fills.');
  }
  lastFace=now;
  if (mode==='calibrate' || mode==='center') sample(signal,now);
}
function updateSelection(signal,dt,now) {
  const raw=map(signal.x-correction.x,signal.y-correction.y);
  const previous=filtered ?? raw;
  filtered={x:previous.x*.8+raw.x*.2,y:previous.y*.8+raw.y*.2};
  const point={
    x:Math.max(0,Math.min(window.innerWidth-1,filtered.x)),
    y:Math.max(0,Math.min(window.innerHeight-1,filtered.y))
  };
  cursor.hidden=false;
  cursor.style.left=point.x+'px';
  cursor.style.top=point.y+'px';
  const target=document.elementFromPoint(point.x,point.y)?.closest('#board .tile') ?? null;
  if (target!==focused) {
    resetDwell();
    focused=target;
    focused?.classList.add('ready');
    if (locked!==focused) locked=null;
  }
  if (!focused || focused===locked || now-lastFire<600 ||
      (mode==='check' && focused!==tiles[checks[step]])) return;
  if (!anchor || Math.hypot(point.x-anchor.x,point.y-anchor.y)>55) {
    anchor=point;
    heldMs=0;
  } else heldMs+=dt;
  const fill=Math.min(heldMs/dwellTimes[speedIndex],1)*100+'%';
  focused.style.setProperty('--fill',fill);
  cursor.style.setProperty('--fill',fill);
  if (heldMs<dwellTimes[speedIndex]) return;
  locked=focused;
  lastFire=now;
  if (mode==='play') {select(focused); return;}
  step++;
  if (step<checks.length) {promptCheck(); return;}
  setMode('play','Tracking check passed. Hold your gaze on a tile until its ring fills.');
}
function renderTracking(now) {
  if (!latestSignal || now-lastFace>300) {
    cursor.hidden=true;
    resetDwell();
    filtered=null;
    lastRender=0;
    if (now-lastFace>1500) setStatus('Face out of view. Center your face in the camera.');
    return;
  }
  const dt=lastRender ? Math.min(now-lastRender,50) : 0;
  lastRender=now;
  if (mode==='check') {
    checkMs+=dt;
    if (checkMs>12000) {
      stop('failed','The gaze missed a check tile. Sit square to the screen and select Recalibrate, or click the tiles.');
      return;
    }
  }
  if (mode==='check' || mode==='play') updateSelection(latestSignal,dt,now);
}
function runFrames(session) {
  function frame(now) {
    if (session!==generation) return;
    if (!document.hidden) {
      if (!sending && video.readyState>=2 && video.currentTime!==lastVideo) {
        lastVideo=video.currentTime;
        sending=detector.send({image:video}).catch(()=>{
          if (session===generation) stop('failed','Tracking stopped. Select Recalibrate to restart.');
        }).finally(()=>{if (session===generation) sending=null;});
      }
      renderTracking(now);
    }
    if (session===generation) animation=requestAnimationFrame(frame);
  }
  animation=requestAnimationFrame(frame);
}
async function start() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('Camera access is unavailable here. Open the board in a browser, or click the tiles.');
    return;
  }
  say('Follow the dot with your eyes.');
  releaseCamera();
  const session=++generation;
  setMode('starting','Allow camera access to begin.');
  deadline=setTimeout(()=>{
    if (session===generation) stop('failed','Camera setup timed out. Check the browser permission and select Recalibrate.');
  },40000);
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    if (session!==generation) {stream.getTracks().forEach(track=>track.stop()); return;}
    camera=stream;
    video.srcObject=stream;
    setStatus('Loading the eye tracker…');
    await video.play();
    if (session!==generation) return;
    const model=await createFaceTracker(signal=>{
      if (session===generation && !document.hidden) acceptFrame(signal,performance.now());
    });
    if (session!==generation) {closeModel(model); return;}
    detector=model;
    clearTimeout(deadline);
    lastVideo=-1;
    lastRender=lastFire=0;
    lastFace=performance.now();
    latestSignal=null;
    beginCalibration();
    runFrames(session);
  } catch (error) {
    if (session!==generation) return;
    stop('failed',error.name==='NotAllowedError' ? 'Camera access was blocked. Allow it in your browser or click the tiles.' :
      'Eye tracking could not start. Select Recalibrate to retry, or click the tiles.');
  }
}
get('enable').onclick=start;
get('retry').onclick=()=>detector ? beginCalibration() : start();
get('recenter').onclick=()=>{setMode('center'); markDot();};
get('speed').onclick=()=>{
  speedIndex=(speedIndex+1)%dwellTimes.length;
  get('speed').textContent='Dwell '+(dwellTimes[speedIndex]/1000).toFixed(1)+'s';
  resetDwell();
};
get('stop').onclick=()=>stop('off','Camera off. Click a tile, or start eye gaze again.');
window.addEventListener('resize',()=>{if (detector) beginCalibration();});
document.addEventListener('scroll',()=>{resetDwell(); filtered=null;},{passive:true});
document.addEventListener('visibilitychange',()=>{
  latestSignal=null;
  cursor.hidden=true;
  resetDwell();
  filtered=null;
  lastRender=0;
  if (mode==='calibrate' || mode==='center') markDot();
});
window.addEventListener('pagehide',()=>{if (mode!=='off') stop('off','Camera off.');});
</script>
</body>
</html>
